name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test-email endpoint tests
        run: node --experimental-strip-types --test apps/web/tests/test-email*.test.mjs

      - name: Keyboard wiring regression tests
        run: node --test apps/mobile/tests/keyboard.test.mjs

      - name: Follow-up display regression tests
        run: node --experimental-strip-types --test packages/core/tests/followup.test.mjs

      - name: Build
        run: npm run build
